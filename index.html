<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>In Between Time</title>
<style>@font-face{font-family:"Noto Serif JP";font-style:normal;font-weight:300;font-display:swap;src:url(fonts/noto-serif-jp-300-subset.woff2) format("woff2");}</style>
<style>
/* Layout: one full-bleed screen. A three.js scene (corridor, gate, shaft, falling photos) is post-processed in WebGL; a 2D layer on top draws blob tracking and the closing title. */
:root{ --black:#040303; --white:#edebe6; color-scheme:dark; }
html,body{height:100%;margin:0;background:var(--black);color:var(--white);overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;background:var(--black);cursor:pointer;touch-action:none}
#gl,#trk{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{image-rendering:pixelated}
#trk{pointer-events:none}
#nogl[hidden]{display:none}
#nogl{position:absolute;inset:0;display:grid;place-items:center;font:13px ui-monospace,monospace;padding-inline:16px;text-align:center}
</style>
<script src="three.min.js"></script>

</head>
<body>
<div id="stage" role="application" aria-label="In Between Time">
  <canvas id="gl"></canvas>
  <canvas id="trk"></canvas>
  <div id="nogl" hidden>WEBGL IS NOT AVAILABLE</div>
</div>

<script>
(()=>{
'use strict';
const N=152;
const $=s=>document.querySelector(s);
const stage=$('#stage'),glc=$('#gl'),trk=$('#trk'),tk=trk.getContext('2d');
const pad=(n,l=3)=>String(n).padStart(l,'0');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const mixf=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeIn=t=>t*t*t;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);


/* ================= GL compositor ================= */
const gl=glc.getContext('webgl',{antialias:false,alpha:false,premultipliedAlpha:false});
if(!gl){$('#nogl').hidden=false;return;}
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const COMMON=`precision highp float;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
`;
const FS_LAYER=COMMON+`
uniform sampler2D uTex;uniform vec2 uRes;
uniform float uScale,uRot,uOpaque,uTwist,uFeather,uFeatherEnd,uFrame,uGain,uClean,uBend;
vec3 samp(vec2 l){float e=max(abs(l.x),abs(l.y));vec2 m=e>0.985?l/e*0.985:l;return texture2D(uTex,vec2(m.x*.5+.5,.5-m.y*.5)).rgb;}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*uRes)/(.5*min(uRes.x,uRes.y));
  p*=1.+uBend*dot(p,p);
  float r=max(length(p),1e-4);float a=atan(p.y,p.x)+uTwist*log(r);
  vec2 q=vec2(cos(a),sin(a))*r;float c=cos(uRot),s=sin(uRot);
  vec2 l=vec2(c*q.x-s*q.y,s*q.x+c*q.y)/uScale;float e=max(abs(l.x),abs(l.y));
  vec3 g=samp(l);g*=1.-.5*smoothstep(1.,1.8,e);
  g*=1.-uClean*.4*smoothstep(1.15,1.8,uScale);
  g=max(g,vec3(uFrame*(1.-smoothstep(0.,.008,abs(e-1.)))));
  g*=uGain;
  float al=uOpaque>.5?1.:1.-smoothstep(uFeather,uFeatherEnd,e);
  al*=mix(1.,smoothstep(.42,.75,uScale),uClean*(1.-uOpaque));
  gl_FragColor=vec4(g,al);
}`;
const FS_DOME=COMMON+`
uniform sampler2D uT0,uT1,uT2,uT3,uT4,uT5;uniform vec2 uRes;
uniform float uP,uK0,uN,uSpread,uSoft,uSpiral,uNoise,uTwist,uFront,uTime,uDist,uDome,uGain,uRotAmt;
uniform vec4 uW;uniform vec2 uDir;uniform float uSwirlAmt,uFlowAmt,uRipple,uRipT,uSlit,uMelt,uKal,uShat;
float fbm(vec2 x){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*vnoise(x);x*=2.03;a*=.5;}return s;}
vec3 vor(vec2 x){vec2 n=floor(x),f=fract(x);float d1=8.,d2=8.;vec2 id=vec2(0.);
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(float(i),float(j));vec2 o=vec2(hash(n+g),hash(n+g+19.7));vec2 rr=g+o-f;float d=dot(rr,rr);
    if(d<d1){d2=d1;d1=d;id=n+g;}else if(d<d2)d2=d;}
  return vec3(id,sqrt(d2)-sqrt(d1));}
vec3 pick(float i,vec2 uv){if(i<.5)return texture2D(uT0,uv).rgb;if(i<1.5)return texture2D(uT1,uv).rgb;if(i<2.5)return texture2D(uT2,uv).rgb;if(i<3.5)return texture2D(uT3,uv).rgb;if(i<4.5)return texture2D(uT4,uv).rgb;return texture2D(uT5,uv).rgb;}
vec2 mirror(vec2 u){return 1.-abs(1.-mod(u,2.));}
vec3 photo(float k,float age,vec2 q){
  if(k>uN-.5)return vec3(0.);
  float i=clamp(k-uK0,0.,5.);
  float z=1.2-0.34*clamp((age+1.)*.5,0.,1.);
  float rr=(hash(vec2(max(k,0.),3.1))-.5)*6.283*uRotAmt+age*.4*uDist;
  float c=cos(rr),s=sin(rr);
  vec2 l=vec2(c*q.x-s*q.y,s*q.x+c*q.y)*z;
  return pick(i,mirror(vec2(l.x*.5+.5,.5-l.y*.5)));
}
void main(){
  float ar=uRes.x/uRes.y;
  vec2 p=(gl_FragCoord.xy/uRes-.5)*2.;p.x*=ar;p/=length(vec2(ar,1.));
  float r=length(p),th=atan(p.y,p.x);
  float seg=6.2832/6.;float thk=abs(mod(th+uTime*.08,seg)-seg*.5);
  if(uKal>0.001){th=mix(th,thk,uKal);p=vec2(cos(th),sin(th))*r;}
  p.y+=uMelt*(fbm(vec2(p.x*3.,uTime*.35))-.35)*(.6+.4*p.y);
  p.x+=uSlit*(hash(vec2(floor(p.y*46.),floor(uTime*9.)))-.5)*step(.35,hash(vec2(floor(p.y*11.),floor(uTime*3.))));
  float rp=sin(r*26.-uRipT*13.)*exp(-uRipT*1.4)*exp(-abs(r-uRipT*.55)*3.5);
  p*=1.+uRipple*rp*.07;
  vec2 fw=vec2(fbm(p*1.6+vec2(uTime*.12,0.)),fbm(p*1.6+vec2(4.1,-uTime*.1)))-.5;
  p+=fw*uFlowAmt;
  r=length(p);th=atan(p.y,p.x);float lr=log(max(r,1e-3));
  vec3 vc=vor(p*3.2+vec2(0.,uTime*.05));
  float n=vnoise(p*2.6+vec2(uTime*.15,-uTime*.11))-.5;
  float tw=th+uTwist*lr;
  float g=uW.x*(r-.25)+uW.y*(dot(p,uDir)*.55+.3)+uW.z*(fbm(p*1.3+uTime*.07)-.25)*1.5+uW.w*hash(vc.xy);
  float tau=uP+uSpread*g+uSpiral*sin(tw*3.+uTime*.2)+uNoise*n;
  float k=floor(tau),f=tau-k;
  float wv=sin(3.14159*f);wv*=wv;
  float a2=tw+uSwirlAmt*uFront*wv*(.35+r);
  float rq=r*((1.-uDome)+uDome*r*r)+n*.06*uFront*wv;
  vec2 q=vec2(cos(a2),sin(a2))*rq;
  q+=(vec2(hash(vc.xy+3.),hash(vc.xy+7.))-.5)*uShat*.45;
  vec3 A=photo(k,f,q),B=photo(k+1.,f-1.,q);
  vec3 col=mix(A,B,smoothstep(.5-uSoft,.5+uSoft,f));
  col*=1.-uShat*.85*(1.-smoothstep(0.,.045,vc.z));
  col*=uGain*(1.-.4*smoothstep(.55,1.05,r));
  gl_FragColor=vec4(col,1.);
}`;
const FS_FEED=COMMON+`
uniform sampler2D uPrev,uVort,uScene,uLay;uniform vec2 uRes;
uniform float uSceneAmt,uPersist,uMosh,uTime,uSeed,uZoom,uSwirl,uFlow,uVortGain,uLayMix;
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;float ar=uRes.x/uRes.y;
  vec2 c=uv-.5;c.x*=ar;float cs=cos(uSwirl),sn=sin(uSwirl);
  c=vec2(cs*c.x-sn*c.y,sn*c.x+cs*c.y)*(1.-uZoom);
  vec2 fl=vec2(vnoise(uv*3.5+vec2(uTime*.13,0.)),vnoise(uv*3.5+vec2(5.2,uTime*.11)))-.5;
  vec2 puv=vec2(c.x/ar,c.y)+.5+fl*uFlow;
  vec2 blk=floor(uv*vec2(32.,18.));float hb=hash(blk+uSeed);float m=step(hb,uMosh);
  vec2 dr=(vec2(hash(blk+uSeed+3.1),hash(blk+uSeed+7.7))-.5)*vec2(.05,.012);
  puv=mix(puv,uv+dr,m);
  vec3 prev=texture2D(uPrev,puv).rgb;
  vec4 sc=texture2D(uScene,vec2(uv.x,1.-uv.y));
  vec3 base=mix(texture2D(uVort,vec2(uv.x,1.-uv.y)).rgb,texture2D(uLay,uv).rgb,uLayMix)*uVortGain;
  vec3 src=mix(base,sc.rgb,uSceneAmt*sc.a);
  float k=(1.-uPersist)*(1.-m);
  k=mix(k,1.,step(.0,lum(src)-lum(prev))*k*.6);
  gl_FragColor=vec4(mix(prev,src,clamp(k,0.,1.)),1.);
}`;
const FS_POST=COMMON+`
uniform sampler2D uTex,uOver;uniform vec2 uRes;
uniform float uPix,uTime,uTear,uSeed2,uSplitA,uSplitAmt,uThin,uContrast,uBright,uInvert,uVig,uMono,uChroma,uCCon,uGrain,uBlack;uniform vec2 uSplitO;
float bayer2(vec2 a){a=floor(a);return fract(dot(a,vec2(.5,a.y*.75)));}
float bayer4(vec2 a){return bayer2(.5*a)*.25+bayer2(a);}
float bayer8(vec2 a){return bayer4(.5*a)*.25+bayer2(a);}
void main(){
  vec2 cell=floor(gl_FragCoord.xy/uPix);
  vec2 uv0=(cell+.5)*uPix/uRes;vec2 uv=uv0;
  float nb=mix(5.,42.,hash(vec2(uSeed2,1.7)));float bi=floor(uv.y*nb);float hb=hash(vec2(bi,uSeed2));
  uv.x+=(hb-.5)*.4*uTear*step(.5,hb);
  float jl=floor(cell.y/2.);
  uv.x+=(hash(vec2(jl,floor(uTime*30.)))-.5)*.02*uThin*step(.82,hash(vec2(floor(jl/4.),floor(uTime*15.))));
  vec2 n=vec2(cos(uSplitA),sin(uSplitA));vec2 so=uv-uSplitO;so.x*=uRes.x/uRes.y;
  float sd=dot(so,n);float side=sign(sd);
  uv+=side*(vec2(-n.y,n.x)*uSplitAmt*.8+n*uSplitAmt*.25);
  vec2 ca=(uv-.5)*uChroma;
  vec3 col=vec3(texture2D(uTex,uv+ca).r,texture2D(uTex,uv).g,texture2D(uTex,uv-ca).b);
  if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.)col=vec3(0.);
  if(abs(sd)<uSplitAmt*.35)col=vec3(0.);
  vec2 q=uv0-.5;q.x*=uRes.x/uRes.y;float vg=1.-uVig*smoothstep(.3,1.05,length(q));
  float l=lum(col);l=(l-.5)*uContrast+.5+uBright;l*=vg;
  float th=mix(bayer8(cell),hash(cell+fract(uTime*13.37)*vec2(91.7,47.3)),.42+.5*uThin);
  float v=step(th,clamp(l,0.,1.));
  vec3 mono=mix(vec3(.016,.012,.012),vec3(.93,.92,.9),v);
  vec3 c=(col-.5)*uCCon+.5+uBright*.6;c*=vg;
  c+=(hash(cell+fract(uTime*7.1)*vec2(13.1,71.7))-.5)*uGrain;
  vec3 o=bayer8(cell+3.)<uMono?mono:clamp(c,0.,1.);
  float ov=texture2D(uOver,vec2(gl_FragCoord.x/uRes.x,1.-gl_FragCoord.y/uRes.y)).a;
  o=mix(o,vec3(.016,.012,.012),uBlack);
  o=mix(o,1.-o,ov);
  o=mix(o,1.-o,uInvert);
  gl_FragColor=vec4(o,1.);
}`;
function mkProg(fs,names){
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;};
  const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));
  const u={};names.forEach(n=>u[n]=gl.getUniformLocation(p,n));return {p,u};
}
const P_FEED=mkProg(FS_FEED,['uPrev','uVort','uScene','uLay','uRes','uSceneAmt','uPersist','uMosh','uTime','uSeed','uZoom','uSwirl','uFlow','uVortGain','uLayMix']);
const P_DOME=mkProg(FS_DOME,['uT0','uT1','uT2','uT3','uT4','uT5','uRes','uP','uK0','uN','uSpread','uSoft','uSpiral','uNoise','uTwist','uFront','uTime','uDist','uDome','uGain','uRotAmt','uW','uDir','uSwirlAmt','uFlowAmt','uRipple','uRipT','uSlit','uMelt','uKal','uShat']);
const P_LAYER=mkProg(FS_LAYER,['uTex','uRes','uScale','uRot','uOpaque','uTwist','uFeather','uFeatherEnd','uFrame','uGain','uClean','uBend']);
const P_POST=mkProg(FS_POST,['uTex','uOver','uRes','uPix','uTime','uTear','uSeed2','uSplitA','uSplitAmt','uThin','uContrast','uBright','uInvert','uVig','uSplitO','uMono','uChroma','uCCon','uGrain','uBlack']);
{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);}
function mkTex(w,h,src){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  if(src)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
function mkFBO(w,h){const t=mkTex(w,h);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);return {t,f,w,h};}
function delFBO(o){if(!o)return;gl.deleteTexture(o.t);gl.deleteFramebuffer(o.f);}

/* sizes */
const BUF_DIV=2;let W=0,H=0,BW=0,BH=0,FBA=null,FBB=null,FBV=null;
const fin=document.createElement('canvas'),fx=fin.getContext('2d');       // final collage (transparent)
const settled=document.createElement('canvas'),sx2=settled.getContext('2d');
const over=document.createElement('canvas'),ox=over.getContext('2d');
const blank=document.createElement('canvas');blank.width=blank.height=2;
let sceneTex=null,overTex=null,threeTex=null,overDirty=true;
function resize(){
  const s=Math.min(1,1920/innerWidth);
  W=Math.round(innerWidth*s);H=Math.round(innerHeight*s);glc.width=W;glc.height=H;
  BW=Math.ceil(W/BUF_DIV);BH=Math.ceil(H/BUF_DIV);
  [FBA,FBB,FBV].forEach(delFBO);FBA=mkFBO(BW,BH);FBB=mkFBO(BW,BH);FBV=mkFBO(BW,BH);
  [fin,settled].forEach(c=>{c.width=BW;c.height=BH;});over.width=W;over.height=H;
  trk.width=innerWidth;trk.height=innerHeight;
  [sceneTex,overTex,threeTex].forEach(t=>t&&gl.deleteTexture(t));
  sceneTex=mkTex(1,1,blank);overTex=mkTex(1,1,over);threeTex=mkTex(1,1,blank);overDirty=true;
  if(R3){R3.renderer.setSize(BW,BH,false);R3.cam.aspect=BW/BH;R3.cam.updateProjectionMatrix();}
  restamp();
}

/* ================= assets ================= */
const imgs=new Array(N).fill(null);let contig=0;const rdy=new Array(N).fill(false);
let poleImg=null,audioLoaded=0;
function bump(){while(contig<N&&rdy[contig])contig++;}
(function(){let next=0;const one=()=>{if(next>=N)return;const i=next++;const im=new Image();im.decoding='async';
  im.onload=()=>{imgs[i]=im;rdy[i]=true;bump();one();};im.onerror=()=>{rdy[i]=true;bump();one();};im.src='p/'+pad(i)+'.jpg';};
  for(let k=0;k<6;k++)one();})();
{const im=new Image();im.onload=()=>{poleImg=im;restamp();};im.src='pole_wide.jpg';}
const texCache=new Map();
function texFor(k){if(texCache.has(k))return texCache.get(k);const im=imgs[k];if(!im)return null;const t=mkTex(1,1,im);texCache.set(k,t);return t;}
function pruneTex(base){if(texCache.size<20)return;for(const [k,t] of texCache)if(k<base-2||k>base+9){gl.deleteTexture(t);texCache.delete(k);}}
const blackTex=mkTex(1,1,blank);


/* ================= audio ================= */
const ACtor=window.AudioContext||window.webkitAudioContext;let AC=null;
try{AC=new ACtor();}catch(e){}
const STEMS={far:{file:'a/far.mp3',gain:0.267},low:{file:'a/low.mp3',gain:2.49},thin:{file:'a/thin.mp3',gain:5.04}};
const V={file:'a/vortex.mp3',buf:null,rev:null,src:null,rate:1,base:1,wob:0,playhead:0,on:false,lastStutter:-9,lastRev:-9};
let master=null,revIn=null,noiseB=null,muted=false,playing=null;
const ANA={},AN_BUF=new Float32Array(1024);
function makeIR(sec){const len=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,len,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}return b;}
function decode(url){return fetch(url).then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>AC.decodeAudioData(b,res,rej)));}
if(AC){
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-8;comp.ratio.value=12;comp.knee.value=2;comp.attack.value=0.002;comp.release.value=0.15;
  master=AC.createGain();master.gain.value=0.22;master.connect(comp);comp.connect(AC.destination);
  const conv=AC.createConvolver();conv.buffer=makeIR(3);revIn=AC.createGain();revIn.gain.value=1;revIn.connect(conv);conv.connect(master);
  noiseB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);{const d=noiseB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  for(const s of Object.values(STEMS)){
    s.an=AC.createAnalyser();s.an.fftSize=1024;
    s.lp=AC.createBiquadFilter();s.lp.type='lowpass';s.lp.frequency.value=20000;s.lp.Q.value=0.7;
    s.g=AC.createGain();s.g.gain.value=0;s.lp.connect(s.g);s.g.connect(master);
    decode(s.file).then(b=>{s.buffer=b;audioLoaded++;}).catch(()=>{audioLoaded++;});
  }
  // vortex track chain: duck -> lowpass -> gain -> master, + delay and reverb sends, + band analysers
  V.duck=AC.createGain();V.lp=AC.createBiquadFilter();V.lp.type='lowpass';V.lp.frequency.value=300;V.lp.Q.value=0.9;
  V.g=AC.createGain();V.g.gain.value=0;V.duck.connect(V.lp);V.lp.connect(V.g);V.g.connect(master);
  V.dl=AC.createDelay(2);V.dl.delayTime.value=0.375;V.fb=AC.createGain();V.fb.gain.value=0.38;V.dlf=AC.createBiquadFilter();V.dlf.type='lowpass';V.dlf.frequency.value=2200;
  V.dsend=AC.createGain();V.dsend.gain.value=0.0;V.g.connect(V.dsend);V.dsend.connect(V.dl);V.dl.connect(V.dlf);V.dlf.connect(V.fb);V.fb.connect(V.dl);V.dlf.connect(master);
  V.rsend=AC.createGain();V.rsend.gain.value=0.15;V.g.connect(V.rsend);V.rsend.connect(revIn);
  V.anF=AC.createAnalyser();V.anF.fftSize=1024;V.lp.connect(V.anF);
  const lo=AC.createBiquadFilter();lo.type='lowpass';lo.frequency.value=160;V.anL=AC.createAnalyser();V.anL.fftSize=1024;V.lp.connect(lo);lo.connect(V.anL);
  const hi=AC.createBiquadFilter();hi.type='highpass';hi.frequency.value=3000;V.anH=AC.createAnalyser();V.anH.fftSize=1024;V.lp.connect(hi);hi.connect(V.anH);

    fallV=6+(rate+surge)*7;cam.y-=fallV*dt;updateWind(fallV);
    if(AC&&V.on){V.rsend.gain.setTargetAtTime(0.15+0.45*ramp,AC.currentTime,0.5);V.dsend.gain.setTargetAtTime(0.1+0.25*ramp,AC.currentTime,0.5);}
    fb.persist=mixf(0.2,clamp(0.5+0.32*E.far+0.08*ramp,0,0.88),dist);fb.mosh=(0.03+E.hit*0.4+E.far*0.04)*dist;fb.zoom=0.004+(0.01+0.014*rate/3)*dist;fb.swirl=(0.006+0.006*ramp)*dist;fb.flow=(0.004+0.012*E.far)*dist;
    post.tear=(E.hit*0.85+E.thin*0.12)*(1-0.85*vclean);post.split=E.split*0.07;post.contrast=1.45;post.bright=-0.03-E.far*0.05*dist+E.hit*0.04*dist;post.vig=mixf(0.45,0.55+E.far*0.3,dist);
    post.pix=E.thin>0.7&&dist>0.5?1:2;post.invert=invertT>0?1:0;post.mono=0;post.chroma=(E.hit*0.016+E.thin*0.003)*(1-0.7*vclean);post.ccon=1.12+E.thin*0.15*dist;post.grain=mixf(0.03,0.04+E.thin*0.1,dist);
    if(pos>=N-1.5){setState('final');finalAge=0;finalDone=-1;
      if(AC&&V.src){const t=AC.currentTime;V.lp.frequency.cancelScheduledValues(t);V.lp.frequency.setValueAtTime(V.lp.frequency.value,t);V.lp.frequency.exponentialRampToValueAtTime(900,t+4);}}
  }
  if(state==='final'){
    finalAge+=dt;sceneAmt=1;const slow=sstep(0,6,finalAge);
    fallV+=(mixf(20,6,slow)-fallV)*Math.min(1,dt);updateWind(fallV);if(finalAge>8)stopWind(4);
    posL+=dt*mixf(2.5,0.3,slow);pos=Math.min(N+3,posL);drawLay=true;layMix=1;dist=1;vlayGain=mixf(1.05,0.4,slow);
    V.base=mixf(1,0.42,sstep(0,4.5,finalAge));if(hit&&V.on)V.wob=0.6;
    vgain=mixf(1,0.5,slow);
    const cnt=drawFinal(finalAge);uploadCanvas(sceneTex,fin);
    if(cnt>=order.length&&finalDone<0)finalDone=T;
    if(finalDone>0&&T-finalDone>9&&V.on)stopVortex(7);
    fb.persist=0.25;fb.mosh=E.hit*0.05;fb.zoom=0.01*(1-slow)+0.002;fb.swirl=0.002;fb.flow=0.002;
    post.tear=E.hit*0.25+E.thin*0.04;post.split=E.split*0.02;post.contrast=1.3;post.bright=0;post.vig=0.25;post.mono=0;post.chroma=E.hit*0.006;post.ccon=1.08;post.grain=0.035;
    if(hit)E.split=0.35;
  }
  drawTracking(state==='final'?sstep(2,6,finalAge):0,state==='final'&&finalDone>0?sstep(1,7,T-finalDone):0);

  if(overText&&overText.kind==='hear'&&T>=overText.t0&&T<=overText.t0+overText.life)post.black=1;
  if(!(layMix>=0.999&&(state==='fall'||state==='final')))render3D();
  if(drawLay){stepMood(dt,dist,hit);renderDome(domeParams(dist,vlayGain));}
  if(overText){drawOverlay(T);uploadCanvas(overTex,over);overDirty=false;if(T>overText.t0+overText.life+0.1)setOverlay(null);}
  else if(overDirty){drawOverlay(T);uploadCanvas(overTex,over);overDirty=false;}
  fb.sceneAmt=sceneAmt;fb.vgain=vgain;fb.layMix=layMix;
  const acc=renderFeed(fb);
  renderPost(acc,post);
}
requestAnimationFrame(frame);
addEventListener('resize',resize);
window.__s=()=>({pos:+pos.toFixed(2),layMix:+layMix.toFixed(2),state,st:+st.toFixed(2),camy:+cam.y.toFixed(1),camz:+cam.z.toFixed(2),fallT:+fallT.toFixed(1),fallV:+fallV.toFixed(1),next:FIELD.next,passed:FIELD.passed,items:FIELD.items.length,finalAge:+finalAge.toFixed(1),hits:E.hitCount,V:V.on});
window.__jump=(s)=>{if(s==='door'){begin();cam.z=WALK.z1;setState('door');}};
})();
